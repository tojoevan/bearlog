{% load custom_tags %}

{% if bookmarks %}
<section class="bookmark-list">
    <h2>📚 书签</h2>
    <ul>
        {% for bookmark in bookmarks %}
        <li>
            <a href="/bookmark/{{ bookmark.pk }}/click/" target="_blank" rel="noopener noreferrer" title="{{ bookmark.url }}">
                {% if bookmark.title %}{{ bookmark.title|safe_title }}{% else %}{{ bookmark.domain }}{% endif %}
            </a>
            {% if bookmark.description %}
            <p>{{ bookmark.description }}</p>
            {% endif %}
        </li>
        {% endfor %}
    </ul>
</section>
{% endif %}
