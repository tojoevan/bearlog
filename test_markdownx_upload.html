<!DOCTYPE html>
<html>
<head>
    <title>MarkdownX 上传测试</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ccc; }
        .success { background-color: #d4edda; color: #155724; padding: 10px; }
        .error { background-color: #f8d7da; color: #721c24; padding: 10px; }
        .info { background-color: #d1ecf1; color: #0c5460; padding: 10px; }
        img { max-width: 300px; margin: 10px 0; }
    </style>
</head>
<body>
    <h1>MarkdownX 图片上传测试</h1>
    
    <div class="test-section">
        <h2>测试 1: API 直接上传</h2>
        <button onclick="testUpload()">测试上传</button>
        <div id="result1"></div>
    </div>
    
    <div class="test-section">
        <h2>测试 2: 手动选择文件上传</h2>
        <input type="file" id="fileInput" accept="image/*">
        <button onclick="testFileUpload()">上传选中的文件</button>
        <div id="result2"></div>
    </div>
    
    <div class="test-section">
        <h2>测试 3: 检查配置</h2>
        <button onclick="checkConfig()">检查配置</button>
        <div id="result3"></div>
    </div>

    <script>
        // 获取 CSRF token
        function getCSRFToken() {
            const token = document.querySelector('[name=csrfmiddlewaretoken]');
            return token ? token.value : '';
        }
        
        // 测试 1: API 直接上传（创建测试图片）
        function testUpload() {
            const resultDiv = document.getElementById('result1');
            resultDiv.innerHTML = '<p>正在创建测试图片...</p>';
            
            // 创建一个测试图片
            const canvas = document.createElement('canvas');
            canvas.width = 200;
            canvas.height = 200;
            const ctx = canvas.getContext('2d');
            
            // 绘制渐变背景
            const gradient = ctx.createLinearGradient(0, 0, 200, 200);
            gradient.addColorStop(0, 'red');
            gradient.addColorStop(0.5, 'green');
            gradient.addColorStop(1, 'blue');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, 200, 200);
            
            // 添加文字
            ctx.fillStyle = 'white';
            ctx.font = '20px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('Test Image', 100, 100);
            ctx.fillText(new Date().toLocaleTimeString(), 100, 130);
            
            canvas.toBlob(blob => {
                const formData = new FormData();
                formData.append('image', blob, 'test.png');
                
                resultDiv.innerHTML = '<p>正在上传图片...</p>';
                
                fetch('/markdownx/upload/', {
                    method: 'POST',
                    body: formData,
                    headers: {
                        'X-CSRFToken': getCSRFToken()
                    }
                })
                .then(response => {
                    console.log('Response status:', response.status);
                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                    }
                    return response.json();
                })
                .then(data => {
                    console.log('Response data:', data);
                    if (data.image_code) {
                        resultDiv.innerHTML = `
                            <div class="success">
                                <h3>✅ 上传成功！</h3>
                                <p><strong>Markdown 代码:</strong></p>
                                <pre>${data.image_code}</pre>
                                <p><strong>预览:</strong></p>
                                ${data.image_code}
                            </div>
                        `;
                    } else {
                        resultDiv.innerHTML = `
                            <div class="error">
                                <h3>❌ 上传失败</h3>
                                <pre>${JSON.stringify(data, null, 2)}</pre>
                            </div>
                        `;
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    resultDiv.innerHTML = `
                        <div class="error">
                            <h3>❌ 错误</h3>
                            <p>${error.message}</p>
                            <p>请检查浏览器控制台获取更多信息</p>
                        </div>
                    `;
                });
            }, 'image/png');
        }
        
        // 测试 2: 手动选择文件上传
        function testFileUpload() {
            const fileInput = document.getElementById('fileInput');
            const resultDiv = document.getElementById('result2');
            
            if (!fileInput.files || fileInput.files.length === 0) {
                resultDiv.innerHTML = '<div class="error">请先选择一个文件</div>';
                return;
            }
            
            const file = fileInput.files[0];
            const formData = new FormData();
            formData.append('image', file);
            
            resultDiv.innerHTML = `<p>正在上传 ${file.name}...</p>`;
            
            fetch('/markdownx/upload/', {
                method: 'POST',
                body: formData,
                headers: {
                    'X-CSRFToken': getCSRFToken()
                }
            })
            .then(response => {
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                return response.json();
            })
            .then(data => {
                if (data.image_code) {
                    resultDiv.innerHTML = `
                        <div class="success">
                            <h3>✅ 上传成功！</h3>
                            <p><strong>文件名:</strong> ${file.name}</p>
                            <p><strong>Markdown 代码:</strong></p>
                            <pre>${data.image_code}</pre>
                            <p><strong>预览:</strong></p>
                            ${data.image_code}
                        </div>
                    `;
                } else {
                    resultDiv.innerHTML = `
                        <div class="error">
                            <h3>❌ 上传失败</h3>
                            <pre>${JSON.stringify(data, null, 2)}</pre>
                        </div>
                    `;
                }
            })
            .catch(error => {
                resultDiv.innerHTML = `
                    <div class="error">
                        <h3>❌ 错误</h3>
                        <p>${error.message}</p>
                    </div>
                `;
            });
        }
        
        // 测试 3: 检查配置
        function checkConfig() {
            const resultDiv = document.getElementById('result3');
            
            const checks = [
                { name: 'MEDIA_ROOT 配置', value: typeof MEDIA_ROOT !== 'undefined' ? '✅ 已配置' : '⚠️ 需要检查 settings.py' },
                { name: 'media 目录存在', value: '需要后端验证' },
                { name: '上传 API 路径', value: '/markdownx/upload/' },
            ];
            
            let html = '<div class="info"><h3>配置检查</h3><ul>';
            checks.forEach(check => {
                html += `<li><strong>${check.name}:</strong> ${check.value}</li>`;
            });
            html += '</ul>';
            html += '<p>提示: 如果看到 400 错误，通常是因为：</p>';
            html += '<ol>';
            html += '<li>MEDIA_ROOT 未配置</li>';
            html += '<li>media 目录不存在或没有写权限</li>';
            html += '<li>CSRF token 缺失</li>';
            html += '</ol></div>';
            
            resultDiv.innerHTML = html;
        }
    </script>
</body>
</html>
